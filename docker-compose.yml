# Local dev container: hot-reload Vite inside Docker.
# Usage: docker compose up
services:
  dev:
    image: oven/bun:1.2
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development